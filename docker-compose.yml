version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clandeq-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clandeq
      POSTGRES_USER: clandeq_admin
      POSTGRES_PASSWORD: clandeq_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clandeq_admin -d clandeq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
