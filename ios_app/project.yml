name: Clandeq
options:
  bundleIdPrefix: com.papametall
targets:
  Clandeq:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.papametall.Clandeq
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  ClandeqWatch:
    type: watchos-application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/Watch
      - path: Sources/iOS/WatchSessionManager.swift
      - path: Sources/iOS/HapticManager.swift
    dependencies:
      - target: Clandeq
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.papametall.Clandeq.watchkitapp
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
