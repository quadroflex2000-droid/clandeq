name: Clandeq
options:
  bundleIdPrefix: com.papametall
targets:
  Clandeq:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    dependencies:
      - target: ClandeqWatch
        embed: false
      - sdk: libsqlite3.tbd
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: ""
      PRODUCT_BUNDLE_IDENTIFIER: com.papametall.Clandeq
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  ClandeqWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: ""
      PRODUCT_BUNDLE_IDENTIFIER: com.papametall.Clandeq.watchkitapp
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

schemes:
  Clandeq:
    build:
      targets:
        Clandeq: [run, test, profile, analyze]
