name: Clandeq
options:
  bundleIdPrefix: com.papametall
targets:
  Clandeq:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    dependencies:
      - target: ClandeqWatch
        embed: false
      - sdk: libsqlite3.tbd
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Clandeq
        CFBundleIdentifier: com.papametall.Clandeq
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    settings:
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  ClandeqWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    info:
      path: WatchInfo.plist
      properties:
        CFBundleDisplayName: Clandeq Watch
        CFBundleIdentifier: com.papametall.Clandeq.watchkitapp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

schemes:
  Clandeq:
    build:
      targets:
        Clandeq: [run, test, profile, analyze]
