name: Build Clandeq iOS Simulator App

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-simulator:
    name: Build iOS Simulator App (For Web Appetize.io)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios_app
          xcodegen generate

      - name: Build iOS App for Simulator
        run: |
          xcodebuild -project ios_app/Clandeq.xcodeproj \
                     -scheme Clandeq \
                     -destination "platform=iOS Simulator,name=iPhone 15" \
                     -configuration Debug \
                     -derivedDataPath build_derived \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ARCHS="x86_64" \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build > build.log 2>&1

      - name: Commit Compilation Error Log
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "### ⚠️ XCODE COMPILATION ERRORS:" > error_log.txt
          grep -i "error:" build.log -A 5 -B 5 >> error_log.txt || cat build.log >> error_log.txt
          git add error_log.txt
          git commit -m "ci: dump compilation error log [skip ci]"
          git push origin main

      - name: Print Build File Tree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "### 🌲 BUILD PRODUCTS TREE:" > build_tree.txt
          find build_derived/Build/Products/ -maxdepth 4 >> build_tree.txt || echo "No build products" >> build_tree.txt
          git add build_tree.txt
          git commit -m "ci: dump build products tree [skip ci]" || echo "No changes"
          git push origin main

      - name: Compress Simulator Build
        run: |
          cd build_derived/Build/Products/Debug-iphonesimulator/
          zip -r ../../../../Clandeq-Simulator.zip Clandeq.app

      - name: Upload Simulator ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clandeq-Simulator
          path: Clandeq-Simulator.zip
